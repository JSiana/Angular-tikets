<div class="todo-container">
    @for(
        todo of todoData; 
        track todo.id;

        ) {
        <app-todo 
            #todoRef
            [todoData]="todo"

            (onClickIcon)="getTodoInfo($event)"

            >
            <app-input placeholder="Nombres"></app-input>
            <app-input placeholder="Apellidos"></app-input>
            <app-input placeholder="Edad" type="number"></app-input>
            <div class="coment" style="margin-top: 1rem;">
                <textarea  rows="5"></textarea>
            </div>
             
        </app-todo> 

    } @empty {
        No hay datos
    }


</div>
<br>
<button (click)="orderData()">Ordenar</button>

<button (click)="selectTodo()">Seleccionar todo</button>
<button (click)="addTodo()">agregar</button>

<router-outlet />
